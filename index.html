<script>
    let html5QrcodeScanner;

    function switchTab(tab) {
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        
        if(tab === 'escaner') {
            document.getElementById('tab-escaner').classList.add('active');
            document.getElementById('panel-escaner').classList.add('active');
        } else {
            document.getElementById('tab-reportes').classList.add('active');
            document.getElementById('panel-reportes').classList.add('active');
            cargarTabla();
        }
    }

    function iniciarEscaneo() {
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('camera-holder').style.display = 'block';
        
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 15, 
            qrbox: { width: 220, height: 220 },
            rememberLastUsedCamera: true,
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        }, false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText) {
        html5QrcodeScanner.clear();
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('camera-holder').style.display = 'none';
        
        const guardia = document.getElementById('guardia').value;
        const ahora = new Date();
        
        const nuevoRegistro = {
            fecha_hora: ahora.toLocaleString('es-AR'),
            guardia: guardia,
            punto: decodedText
        };

        fetch('/api/fichar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(nuevoRegistro)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                mostrarEstado(`<b>Punto Registrado con Éxito</b><br>📍 ${decodedText}<br>🕒 ${nuevoRegistro.fecha_hora}`, "success");
            } else {
                mostrarEstado("❌ Error al procesar en base de datos Orbis.", "error");
            }
        })
        .catch(err => {
            mostrarEstado("❌ Falla de conectividad con el servidor central.", "error");
            console.error(err);
        });
    }

    function onScanFailure(error) {}

    function mostrarEstado(mensaje, tipo) {
        const s = document.getElementById('status');
        s.style.display = 'block';
        s.className = tipo;
        s.innerHTML = mensaje;
    }

    function cargarTabla() {
        const tbody = document.getElementById('tabla-registros');
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">Buscando registros...</td></tr>';
        
        fetch('/api/historial')
        .then(res => res.json())
        .then(historial => {
            tbody.innerHTML = '';
            if(historial.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">No hay marcaciones el día de hoy.</td></tr>';
                return;
            }
            historial.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${r.fecha_hora}</td><td><b>${r.guardia}</b></td><td><span style="background:#f1f5f9;padding:4px 8px;border-radius:6px;font-weight:600">${r.punto}</span></td>`;
                tbody.appendChild(tr);
            });
        })
        .catch(err => {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--danger)">Error de conexión al cargar datos.</td></tr>';
        });
    }

    function exportarExcel() {
        fetch('/api/historial')
        .then(res => res.json())
        .then(historial => {
            if(historial.length === 0) {
                alert("No existen datos para generar el reporte unificado.");
                return;
            }
            const datosFormateados = historial.map(r => ({
                "Fecha y Hora": r.fecha_hora,
                "Personal de Guardia": r.guardia,
                "Puesto de Control": r.punto
            }));
            const hoja = XLSX.utils.json_to_sheet(datosFormateados);
            const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Rondines_Orbis");
            XLSX.writeFile(libro, `Reporte_Orbis_SanLuis_${new Date().toISOString().slice(0,10)}.xlsx`);
        });
    }

    function borrarHistorial() {
        if(confirm("¿Está seguro de purgar el historial general de Orbis San Luis? Esta acción no se puede deshacer.")) {
            fetch('/api/historial', { method: 'DELETE' })
            .then(() => cargarTabla());
        }
    }
</script>
</body>
</html>
